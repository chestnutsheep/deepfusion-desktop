[package]
name = "deepfusion-desktop"
version = "0.1.0"
description = "DeepFusion desktop application shell"
authors = ["DeepFusion"]
edition = "2021"

[lib]
name = "deepfusion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = [] }
tauri-plugin-single-instance = "2.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
